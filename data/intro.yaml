# The sticky note pinned at the top of the home page. Body is Markdown.
label: "A note before you start"
body: |
  Hi, I'm Gawon Ryu (Hannah, if we met in English class). I'm a high school senior who cries at commercials and then needs to know exactly how they did it.

  This blog is where I find out. Each essay takes one ad that got to me and traces the feeling back to the psychology behind it, with the research listed at the end so you can check my work. Start anywhere. If an ad here made you feel something too, read that one first.
signature: "Gawon"
