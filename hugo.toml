baseURL = "https://joyinads.netlify.app/"
languageCode = "en-us"
title = "The Power of Joy in Marketing & Advertising"
theme = "joy"
enableRobotsTXT = true
buildDrafts = false
buildFuture = false

[taxonomies]
  tag = "tags"

[params]
  description = "Psychology, emotion, and what makes great advertising work."
  # Three essays pictured in the homepage masthead (content file names).
  mastheadPicks = ["sony-bravia-balls", "lego-rebuild-the-world", "old-spice-man-your-man"]

[related]
  includeNewer = true
  threshold = 0
  toLower = true
  [[related.indices]]
    name = "tags"
    weight = 100

[markup.goldmark.renderer]
  unsafe = false

[menu]
  [[menu.main]]
    name = "Essays"
    url = "/#essays"
    weight = 1
  [[menu.main]]
    name = "Archive"
    url = "/archives/"
    weight = 2
  [[menu.main]]
    name = "Topics"
    url = "/tags/"
    weight = 3
