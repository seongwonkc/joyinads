<header class="site-header" data-header>
  <div class="wrap header-inner">
    <a class="brand" href="{{ "/" | relURL }}" aria-label="{{ site.Title }}, home">
      {{ partial "logo.html" . }}
      <span class="brand-name">The Power of Joy</span>
    </a>
    <nav class="nav" aria-label="Main">
      {{- $here := .RelPermalink }}
      {{- range site.Menus.main }}
      <a href="{{ .URL | relURL }}"{{ if eq $here (.URL | relURL) }} aria-current="page"{{ end }}>{{ .Name }}</a>
      {{- end }}
      <button class="theme-toggle" type="button" data-theme-toggle aria-label="Switch to dark theme">
        <svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 14.6A8.5 8.5 0 0 1 9.4 3.5a8.5 8.5 0 1 0 11.1 11.1Z" fill="currentColor"/></svg>
        <svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.5" fill="currentColor"/><g stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 1.8v2.4M12 19.8v2.4M1.8 12h2.4M19.8 12h2.4M4.8 4.8l1.7 1.7M17.5 17.5l1.7 1.7M4.8 19.2l1.7-1.7M17.5 6.5l1.7-1.7"/></g></svg>
      </button>
    </nav>
  </div>
</header>
